name: tests

on:
  push:
    branches: ["**"]
  pull_request: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run test suite (incl. risk-gate safety tests and the research protocol tools)
        run: python -m pytest tests/ research/src/tests -q
