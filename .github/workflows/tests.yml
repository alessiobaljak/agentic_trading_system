name: tests

on:
  # Solo il branch principale (11 ott 2026, richiesta del proprietario: troppe e-mail di GitHub). I branch della
  # ricerca (research/...) non li legge il bot: le sessioni lanciano i test da sole, e ogni loro push faceva partire
  # la suite e mandava un'e-mail a ogni fallimento.
  push:
    branches: ["claude/brave-albattani-1b12fv"]
  pull_request: {}
  workflow_dispatch: {}

# Dal 27 novembre 2026 (audit del 26-27 novembre): dal 19 ottobre ogni corsa si fermava mentre raccoglieva i test
# (mancava numba), e nessuno se n'era accorto. Ora: le librerie della ricerca con la versione fissa
# (requirements-ricerca.txt), due lavori in parallelo, un limite di tempo largo, una sola corsa per branch alla volta
# e -rs, per vedere perché un test viene saltato. La corsa che gira finisce sempre; di quelle in attesa resta solo la
# più nuova (con «cancel-in-progress: true» le spinte di tutte le sessioni, una ogni pochi minuti, fermavano ogni corsa
# a metà: il 27 novembre le tre corse partite fra le 04:12 e le 04:22 sono state annullate tutte).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    name: tests/ (bot, limiti fissi, ricerca di oggi)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ricerca.txt
      - run: pip install -r requirements.txt -r requirements-ricerca.txt
      - name: Run test suite (incl. risk-gate safety tests)
        run: python -m pytest tests/ -q -rs

  pytest-ricerca:
    name: research/src/tests (strumenti dei protocolli)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ricerca.txt
      - run: pip install -r requirements.txt -r requirements-ricerca.txt
      - name: Run the research protocol tools tests
        run: python -m pytest research/src/tests -q -rs
