name: state-snapshot

# Legge lo stato da Firebase (risultati ottimizzazione, stato bot, posizioni) e
# committa un riepilogo in docs/state.md. Serve a controllare la VPS da remoto
# (telefono / repo) senza SSH, e permette a Claude di leggerlo con git pull.
on:
  schedule:
    - cron: "15 */2 * * *"     # ogni 2 ore
  workflow_dispatch: {}
  push:
    branches: ["claude/brave-albattani-1b12fv"]
    paths: ["scripts/state_snapshot.py", ".github/workflows/snapshot.yml"]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/brave-albattani-1b12fv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read Firebase state
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
        run: python -m scripts.state_snapshot
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/state.md
          if ! git diff --cached --quiet; then
            git commit -m "state snapshot [skip ci]"
            git pull --rebase --autostash origin claude/brave-albattani-1b12fv || true
            git push origin HEAD:claude/brave-albattani-1b12fv
          else
            echo "nessun cambiamento"
          fi
