name: azioni-miscela

# La miscela sul conto demo (stock/avanti/MISCELA.md): stesso conto demo della prima candela (decisione del proprietario, 12 nov 2026),
# stessi segreti (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY e quelli della Plancia), titoli e capitale virtuale suoi
# (stock/avanti/conto.py).
#
# CHI AVVIA NON DEVE ESSERE PUNTUALE, come per la prima candela: ogni avvio lancia «auto», che guarda l'orologio di New York. La
# decisione della sera si prende a qualunque ora fra la chiusura e l'apertura dopo (ordini «all'apertura», accettati da Alpaca dalle
# 19:00); la regola della banca centrale resta accesa e aspetta le 14:00 o le 13:59 (fino a 5 ore e 20 minuti prima). Avvii: GitHub
# ogni mezz'ora e le routine della sessione «trading stock». Gli orari programmati girano solo se esiste stock/avanti/miscela_accesa.
on:
  schedule:
    - cron: "5,35 * * * 1-5"
    - cron: "5,35 0-14 * * 6"     # venerdì sera e notte a New York
  workflow_dispatch:
    inputs:
      comando:
        description: "auto | controlla | plancia"
        required: true
        default: auto

permissions:
  contents: write

concurrency:
  group: azioni-miscela
  cancel-in-progress: false

jobs:
  miscela:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/brave-albattani-1b12fv
      - name: Accesa?
        id: accesa
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.comando }}" != "auto" ]; then
            echo "comando=${{ inputs.comando }}" >> "$GITHUB_OUTPUT"
          elif [ ! -f stock/avanti/miscela_accesa ]; then
            echo "comando=" >> "$GITHUB_OUTPUT"; echo "spenta: manca stock/avanti/miscela_accesa"
          else
            echo "comando=auto" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.accesa.outputs.comando != ''
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
        if: steps.accesa.outputs.comando != ''
      - name: Miscela
        if: steps.accesa.outputs.comando != ''
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          AZIONI_FIREBASE_URL: ${{ secrets.AZIONI_FIREBASE_URL }}
          AZIONI_FIREBASE_API_KEY: ${{ secrets.AZIONI_FIREBASE_API_KEY }}
          AZIONI_FIREBASE_EMAIL: ${{ secrets.AZIONI_FIREBASE_EMAIL }}
          AZIONI_FIREBASE_PASSWORD: ${{ secrets.AZIONI_FIREBASE_PASSWORD }}
        run: python -m stock.avanti.miscela "${{ steps.accesa.outputs.comando }}"
      - name: Salva lo stato nel repository
        if: always() && steps.accesa.outputs.comando != ''
        run: |
          git config user.name "azioni-miscela"
          git config user.email "noreply@anthropic.com"
          git add stock/avanti/miscela_stato.json stock/avanti/miscela_diario.csv stock/avanti/conto_condiviso.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "niente da salvare"; exit 0; fi
          git commit -m "stock: miscela, ${{ steps.accesa.outputs.comando }} del $(date -u +%F) (GitHub) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin claude/brave-albattani-1b12fv && git push origin HEAD:claude/brave-albattani-1b12fv && exit 0
            sleep $((i * 5))
          done
          exit 1
