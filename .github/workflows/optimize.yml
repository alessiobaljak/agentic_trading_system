name: strategy-optimizer

# Motore di validazione AUTONOMO (test -> learn -> iterate). Gira ogni 6h su
# GitHub (nessuna VPS necessaria in questa fase): ottimizza un universo ampio di
# crypto via walk-forward out-of-sample e ACCUMULA un registro di validazione su
# Firebase. Quando ci sono strategie validate su abbastanza crypto -> GATE 1.
on:
  schedule:
    - cron: "0 */6 * * *"      # ogni 6 ore
  workflow_dispatch:
    inputs:
      top:
        description: "Top-N future per volume (universo)"
        default: "20"
      windows:
        description: "Finestre walk-forward"
        default: "3"
  push:
    branches: ["claude/brave-albattani-1b12fv"]
    paths: ["backtesting/optimizer.py", "backtesting/engine.py", "scripts/optimize.py",
            "bot/strategies/**", "bot/core/indicators.py",
            ".github/workflows/optimize.yml"]

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Walk-forward optimization (autonomo, universo top-N)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python -m scripts.optimize
          --top ${{ inputs.top || '40' }}
          --windows ${{ inputs.windows || '3' }}
          --max-combos 12
          --start 2024-01-01 --end 2026-01-01
