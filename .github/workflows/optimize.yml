name: strategy-optimizer

# Motore di validazione AUTONOMO (test -> learn -> iterate). Gira ogni 6h su
# GitHub. PARALLELIZZATO in shard: ogni job ottimizza una fetta dell'universo,
# poi il job `merge` riunisce i risultati e aggiorna il registro UNA volta sola.
# Così copriamo l'INTERO universo (top 75, 4 anni, max-combos 12) nel timeout.
on:
  schedule:
    - cron: "0 */6 * * *"      # ogni 6 ore
  workflow_dispatch:
    inputs:
      top:
        description: "Top-N future per volume (universo)"
        default: "80"
  push:
    branches: ["claude/brave-albattani-1b12fv"]
    paths: ["backtesting/optimizer.py", "backtesting/engine.py", "scripts/optimize.py",
            "bot/strategies/**", "bot/core/indicators.py",
            ".github/workflows/optimize.yml"]

env:
  NUM_SHARDS: "6"
  TOP: "80"

jobs:
  optimize:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Walk-forward shard ${{ matrix.shard }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
        run: >
          python -m scripts.optimize
          --top ${{ inputs.top || env.TOP }}
          --windows 3 --max-combos 12 --start 2022-01-01
          --shard ${{ matrix.shard }} --num-shards ${{ env.NUM_SHARDS }}

  merge:
    needs: optimize
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Merge shard results into registry
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.optimize --merge --num-shards ${{ env.NUM_SHARDS }}
