name: azioni-misura-in-avanti

# La misura in avanti delle azioni sul conto demo di Alpaca (stock/avanti/REGOLE.md), con le chiavi nei segreti del repository
# (richiesta del proprietario, 11 nov 2026: «voglio avere quelle chiavi su github secret [...] come per l'agente delle crypto»).
# Segreti: ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY (conto DEMO), AZIONI_FIREBASE_URL, AZIONI_FIREBASE_API_KEY, AZIONI_FIREBASE_EMAIL,
# AZIONI_FIREBASE_PASSWORD (stock/avanti/FIREBASE.md).
#
# CHI AVVIA NON DEVE ESSERE PUNTUALE (12 nov 2026). L'11 novembre gli orari programmati di GitHub sono partiti 6-7 ore dopo, e uno ha
# mandato ordini alle 15:08. Da qui: ogni avvio lancia il comando «auto», che guarda l'orologio di New York e il conto e fa la cosa
# giusta per quell'ora: prima delle 9:45 ASPETTA le 9:45 (fino a 5 ore e 20 minuti prima), dopo le 10:00 non entra mai, dalle 10:35
# aspetta le 15:55 e chiude, a seduta finita chiude fuori orario quello che resta. Gli avvii sono tanti e indipendenti: ogni mezz'ora
# da GitHub, più le routine della sessione «trading stock» (avvio a mano del lavoro, che parte in pochi secondi). I lavori stanno in
# fila (uno alla volta) e gli ordini hanno un nome unico per giorno e titolo: niente doppioni. Gli orari programmati girano solo se
# esiste stock/avanti/acceso_su_github.
on:
  schedule:
    - cron: "15,45 * * * 1-5"
    - cron: "15,45 0 * * 6"     # venerdì sera a New York (chiusura fuori orario fino alle 20:00)
  workflow_dispatch:
    inputs:
      comando:
        description: "auto | controlla | plancia | elenco | apri | chiudi | chiudi_fuori_orario"
        required: true
        default: auto

permissions:
  contents: write

concurrency:
  group: azioni-avanti
  cancel-in-progress: false

jobs:
  avanti:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/brave-albattani-1b12fv
      - name: Acceso?
        id: acceso
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "comando=${{ inputs.comando }}" >> "$GITHUB_OUTPUT"
          elif [ ! -f stock/avanti/acceso_su_github ]; then
            echo "comando=" >> "$GITHUB_OUTPUT"; echo "spento: manca stock/avanti/acceso_su_github"
          else
            echo "comando=auto" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.acceso.outputs.comando != ''
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
        if: steps.acceso.outputs.comando != ''
      - name: Misura in avanti
        if: steps.acceso.outputs.comando != ''
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          AZIONI_FIREBASE_URL: ${{ secrets.AZIONI_FIREBASE_URL }}
          AZIONI_FIREBASE_API_KEY: ${{ secrets.AZIONI_FIREBASE_API_KEY }}
          AZIONI_FIREBASE_EMAIL: ${{ secrets.AZIONI_FIREBASE_EMAIL }}
          AZIONI_FIREBASE_PASSWORD: ${{ secrets.AZIONI_FIREBASE_PASSWORD }}
        run: python -m stock.avanti.avanti "${{ steps.acceso.outputs.comando }}"
      - name: Salva il diario nel repository
        if: always() && steps.acceso.outputs.comando != ''
        run: |
          git config user.name "azioni-avanti"
          git config user.email "noreply@anthropic.com"
          git add stock/avanti/giorni stock/avanti/diario.csv stock/avanti/riepilogo.md stock/avanti/elenco_*.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "niente da salvare"; exit 0; fi
          git commit -m "stock: misura in avanti, ${{ steps.acceso.outputs.comando }} del $(date -u +%F) (GitHub) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin claude/brave-albattani-1b12fv && git push origin HEAD:claude/brave-albattani-1b12fv && exit 0
            sleep $((i * 5))
          done
          exit 1
