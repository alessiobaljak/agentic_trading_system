name: reset-optimizer

# ONE-SHOT: azzera il registro e ricostruisce da zero sull'INTERO universo (top 75,
# 4 anni), parallelizzato in shard. Il merge fa il reset e applica i risultati.
# Parte col push su questo file (o a mano). L'optimizer regolare continua ogni 6h.
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/brave-albattani-1b12fv"]
    paths: [".github/workflows/reset-optimizer.yml"]

env:
  NUM_SHARDS: "3"
  TOP: "80"

jobs:
  shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild shard ${{ matrix.shard }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
        run: >
          python -m scripts.optimize
          --top ${{ env.TOP }} --windows 3 --max-combos 12 --start 2022-01-01
          --shard ${{ matrix.shard }} --num-shards ${{ env.NUM_SHARDS }}

  merge:
    needs: shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reset registry + merge shard results
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.optimize --merge --reset-registry --num-shards ${{ env.NUM_SHARDS }}
