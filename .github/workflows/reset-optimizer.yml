name: reset-optimizer

# DISATTIVATO SU GITHUB. I runner GitHub sono geo-bloccati/rate-limited (Binance
# 451, Bybit 403, OKX 429): qui NON ci sono dati reali, e con --reset-registry
# questo workflow AZZEREREBBE il registro buono (validato sul VPS) scrivendo vuoto.
# La validazione/rebuild va fatta SUL VPS (dove Binance e' raggiungibile):
#   sudo systemctl start trading-optimizer.service
# Lasciato solo il trigger manuale come scorciatoia di emergenza (da NON usare qui).
on:
  workflow_dispatch: {}

env:
  NUM_SHARDS: "8"
  TOP: "80"
  # rebuild one-shot: 1 passata basta (la robustezza la dà il gate severo + la
  # consistenza per finestra + il profit-lock, non il ripetere lo stesso run).
  OPTIMIZER_MIN_PASSES: "1"
  # MAI validare GATE 1 su dati finti: se gli exchange non rispondono, salta la coin.
  BACKTEST_ALLOW_SYNTHETIC: "false"

jobs:
  shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild shard ${{ matrix.shard }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
        run: >
          python -m scripts.optimize
          --top ${{ env.TOP }} --windows 3 --max-combos 12 --start 2022-01-01
          --shard ${{ matrix.shard }} --num-shards ${{ env.NUM_SHARDS }}

  merge:
    needs: shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reset registry + merge shard results
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.optimize --merge --reset-registry --num-shards ${{ env.NUM_SHARDS }}
