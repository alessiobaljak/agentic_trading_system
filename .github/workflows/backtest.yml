name: gate1-backtest

# GATE 1: backtest MULTI-ASSET su dati storici reali (Binance -> Bybit -> OKX).
# Aggrega per strategia su più cripto. Se non profittevole il job fallisce (gate).
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Paniere (separato da virgole)"
        default: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT"
      source:
        description: "Fonte (binance/bybit/okx/coinmetrics/synthetic)"
        default: "binance"
      start:
        default: "2022-01-01"
      end:
        default: "2026-01-01"
  # NIENTE trigger su push: questo job esegue le strategie BASE non ottimizzate su
  # 5 coin e FALLISCE se non profittevole (esse non lo sono mai, grezze) -> falliva
  # cronicamente a ogni push spammando notifiche. Il GATE 1 VERO gira sul VPS
  # (optimize/discover, walk-forward per-coin). Qui resta solo il lancio manuale.

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest (GATE 1, multi-asset)
        run: >
          python -m backtesting.run
          --symbols ${{ inputs.symbols || 'BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT' }}
          --source ${{ inputs.source || 'binance' }}
          --start ${{ inputs.start || '2022-01-01' }}
          --end ${{ inputs.end || '2026-01-01' }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtesting/output/
