name: gate1-backtest

# GATE 1: esegue il backtest su dati STORICI REALI (Binance -> Bybit -> OKX).
# Se le strategie non sono profittevoli il job fallisce (exit 1): è il gate.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Simbolo"
        default: "BTCUSDT"
      source:
        description: "Fonte (binance/bybit/okx/coinmetrics/synthetic)"
        default: "binance"
      start:
        default: "2022-01-01"
      end:
        default: "2026-01-01"
  push:
    branches: ["claude/brave-albattani-1b12fv"]
    paths: ["backtesting/**", "bot/strategies/**", ".github/workflows/backtest.yml"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest (GATE 1)
        run: >
          python -m backtesting.run
          --symbol ${{ inputs.symbol || 'BTCUSDT' }}
          --source ${{ inputs.source || 'binance' }}
          --start ${{ inputs.start || '2022-01-01' }}
          --end ${{ inputs.end || '2026-01-01' }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtesting/output/
